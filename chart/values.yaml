# Copy the `migrations:` block into your chart's values.yaml, alongside the
# app's own `image`. The keys below it are scaffolding so this directory can be
# rendered on its own with `helm template`.
#
# The app image, the migrations image and the schema target move independently.
# That is what makes rollback declarative:
#
#   roll the APP back    -> change image.tag only. The Job sees the database
#                           already at target and exits 0; pods roll back and
#                           /readyz passes because extra columns are ignored.
#                           ONE commit.
#
#   roll the SCHEMA back -> change migrations.target + allowDestructive.
#                           A SECOND commit, after the app one -- PreSync runs
#                           before the Deployment updates, so moving both at
#                           once would drop the schema under pods still running
#                           the new code.

migrations:
  # OFF by default, so merging the template changes nothing: with this false the
  # Job is not rendered at all and the sync behaves exactly as it does today.
  #
  # Turn it on in this order, one environment at a time:
  #
  #   1. Merge the template with enabled: false. Renders nothing. No risk.
  #
  #   2. Set enabled: true in integ while the OLD gateway image is still
  #      deployed. The Job runs, finds nothing pending, and exits 0 -- so it
  #      proves the image pull, the db secret, RBAC and the PreSync ordering
  #      without changing any schema. The old pods still migrate at startup as a
  #      backstop, and both use advisory lock 8274419300112233, so they
  #      serialize rather than collide.
  #
  #   3. Only then roll the new gateway image in integ. Its pods no longer
  #      migrate; the Job already is.
  #
  #   4. Repeat 2 and 3 for prep, then prod.
  #
  # Do NOT deploy the new gateway image with this still false: that image has no
  # migration code, so nothing would migrate at all. A release with no pending
  # revisions survives it, but the next one adding a column leaves the new pods
  # stuck at 503 on /readyz.
  enabled: false

  image:
    repository: <registry>/keep-migrations
    # Append-only: this tag holds every revision ever written. Bump it forward
    # with each release; never roll it back with the app.
    tag: "2026-09-01"
    pullPolicy: IfNotPresent

  # What the schema should be. `head` for every normal release. To roll the
  # schema back, set a specific revision id here AND allowDestructive: true.
  target: head

  # Guards downgrades. Leave false; set it only in the commit that deliberately
  # walks the schema backwards, and set it back afterwards.
  allowDestructive: false

  # activeDeadlineSeconds. Covers the SUM of a release's migrations, not one.
  # Raise it for prod, where the same DDL is slowest. Keep it above the lock
  # timeout in extraEnv below.
  deadline: 900

  # The secret carrying DATABASE_CONNECTION_STRING -- the same one the app
  # Deployment consumes. Required.
  dbSecretName: keep-db

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  extraEnv:
    # Must stay BELOW `deadline` above. The default lock wait is 3600s, so with a
    # 900s deadline Kubernetes kills the Job first and you get a bare
    # DeadlineExceeded with nothing in the logs -- instead of "another process
    # has held the migration lock for more than Ns", which tells you a concurrent
    # sync is the cause rather than a slow migration.
    - name: KEEP_MIGRATION_LOCK_TIMEOUT_SECONDS
      value: "600"

  # Optional; all default to unset.
  # Left unset to match the other workloads in this chart -- OpenShift's
  # restricted SCC assigns a non-root UID and drops capabilities on its own.
  # Fill these in only if a cluster requires it spelled out.
  # podSecurityContext: {}
  # containerSecurityContext: {}
  # serviceAccountName: ""     # falls back to .Values.serviceAccountName
  # nodeSelector: {}
  # tolerations: []
  # affinity: {}

serviceAccountName: keep
imagePullSecrets: []
